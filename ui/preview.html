<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIR//STUDIO UI Preview</title>
  <style>
    :root {
      --bg: #07090d;
      --panel: #121821;
      --panel-2: #1a2230;
      --line: #2a3444;
      --text: #edf2f7;
      --muted: #9aa7b7;
      --yellow: #f5ff00;
      --blue: #00b7ff;
      --green: #58f1a4;
      --red: #ff5a5f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .frame {
      width: 1200px;
      height: 760px;
      background: #0d1118;
      border: 1px solid var(--line);
      display: grid;
      grid-template-columns: 240px 1fr 260px;
    }

    .sidebar,
    .rightbar {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 18px 14px;
    }

    .rightbar {
      border-right: none;
      border-left: 1px solid var(--line);
    }

    .label {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .panelbox {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      padding: 10px;
      margin-bottom: 14px;
    }

    .control-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn {
      flex: 1;
      height: 36px;
      border: 1px solid var(--line);
      background: var(--yellow);
      color: #111;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 10px;
    }

    .btn.alt {
      background: var(--blue);
      color: white;
    }

    .meter {
      height: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
    }

    .meter-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 68%;
      background: linear-gradient(90deg, var(--blue), var(--yellow), var(--green));
    }

    .stage {
      position: relative;
      background: radial-gradient(circle at 30% 20%, rgba(0,183,255,0.12), transparent 28%), linear-gradient(135deg, #05070b, #0f151d);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      overflow: hidden;
    }

    .stage .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(8,8,8,0.82);
      border: 1px solid var(--line);
      padding: 8px 12px;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stage .playzone {
      position: absolute;
      left: 40px;
      right: 40px;
      bottom: 34px;
      height: 200px;
      border: 1px solid rgba(245,255,0,0.5);
      background: rgba(10,15,20,0.42);
      border-radius: 12px;
    }

    .stage .playzone::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 30%, transparent 70%, rgba(255,255,255,0.04));
    }

    .instbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .instbtn {
      border: 1px solid var(--line);
      background: #111924;
      color: var(--muted);
      padding: 8px 12px;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .instbtn.active {
      background: var(--yellow);
      color: #0d1118;
      border-color: var(--yellow);
    }

    .pads {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
      justify-items: center;
    }

    .pad {
      width: 78px;
      height: 78px;
      background: radial-gradient(circle at 35% 25%, #c7af8f, #7d6451 55%, #362b23);
      border: 3px solid rgba(255,255,255,0.9);
      border-radius: 20px;
      box-shadow: inset 0 -8px 12px rgba(0,0,0,0.58), 0 10px 18px rgba(0,0,0,0.4);
      position: relative;
    }

    .pad::after {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #a9835d, #5f4635);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.2);
    }

    .footer {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--panel);
      border-top: 1px solid var(--line);
      gap: 0;
      min-height: 80px;
    }

    .foot {
      border-right: 1px solid var(--line);
      padding: 12px 10px;
    }

    .foot:last-child { border-right: none; }

    .small {
      color: var(--muted);
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .big {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .big.yellow { color: var(--yellow); }
    .big.green { color: var(--green); }
  </style>
</head>
<body>
  <div class="frame">
    <div class="sidebar">
      <div class="label">Controls</div>
      <div class="control-row">
        <button class="btn">Start</button>
        <button class="btn alt">Exit</button>
      </div>

      <div class="label">Volume</div>
      <div class="panelbox">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:11px;color:var(--muted);">Master</span>
          <span style="font-size:20px;color:var(--yellow);font-weight:700;">75</span>
        </div>
        <div class="meter"><div class="meter-fill"></div></div>
      </div>

      <div class="label">Sensitivity</div>
      <div class="panelbox">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:11px;color:var(--muted);">Gesture</span>
          <span style="font-size:18px;color:var(--yellow);font-weight:700;">35</span>
        </div>
        <div class="meter"><div class="meter-fill" style="width:46%"></div></div>
      </div>
    </div>

    <div class="stage">
      <div class="hud">No Signal</div>
      <div class="playzone"></div>
    </div>

    <div class="rightbar">
      <div class="instbar">
        <button class="instbtn active">Drums</button>
        <button class="instbtn">Piano</button>
        <button class="instbtn">Xylophone</button>
      </div>

      <div class="label">Drum Layout</div>
      <div class="pads">
        <div class="pad"></div>
        <div class="pad"></div>
        <div class="pad"></div>
        <div class="pad"></div>
        <div class="pad"></div>
        <div class="pad"></div>
        <div class="pad"></div>
        <div class="pad"></div>
      </div>
    </div>

    <div style="grid-column:1 / -1;" class="footer">
      <div class="foot"><div class="small">Mode</div><div class="big yellow">Drums</div></div>
      <div class="foot"><div class="small">FPS</div><div class="big">60</div></div>
      <div class="foot"><div class="small">Voices</div><div class="big">08</div></div>
      <div class="foot"><div class="small">Latency</div><div class="big">12ms</div></div>
      <div class="foot"><div class="small">Sens</div><div class="big">35</div></div>
      <div class="foot"><div class="small">Conf</div><div class="big">88%</div></div>
      <div class="foot"><div class="small">Status</div><div class="big green">Online</div></div>
    </div>
  </div>
</body>
</html>
